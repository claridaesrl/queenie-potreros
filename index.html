  border-radius: 3px 0 0 3px;

<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1d2a22;--mut:#66736b;--line:#dfe5df;--pri:#1f6b3a;--pri2:#2e8b4e;--verde:#2e9e44;--amarillo:#f2c218;--rojo:#d93025;--gris:#9aa0a6;--sh:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,input,select,textarea{font:inherit}
header{background:linear-gradient(90deg,#123d23,#1f6b3a);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700}header .firma{font-size:10px;opacity:.8;font-style:italic;letter-spacing:.2px}header .sub{font-size:12px;opacity:.75}

.kpi{background:rgba(255,255,255,.1);border-radius:8px;padding:5px 10px;text-align:center;min-width:72px}.kpi b{display:block;font-size:15px}.kpi span{font-size:10.5px;opacity:.8;text-transform:uppercase;letter-spacing:.4px}
.kpi.s b{display:flex;gap:6px;justify-content:center;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;vertical-align:middle}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
nav button{border:0;background:none;padding:11px 13px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
#sync{margin-left:auto;align-self:center;font-size:12px;color:var(--mut);white-space:nowrap;padding-left:10px}
main{flex:1;min-height:0;position:relative}.view{display:none;height:100%}.view.on{display:block}#v-mapa.on{display:flex}
#mapwrap{flex:1;position:relative;display:flex;flex-direction:column}#map{flex:1;background:#203024}

.scroll{overflow:auto;height:100%;padding:14px 16px 40px}
.card{background:var(--card);border-radius:10px;box-shadow:var(--sh);padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:12.5px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);flex:1;min-width:120px}
input,select,textarea{border:1px solid #cfd8d0;border-radius:7px;padding:7px 9px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:auto}textarea{min-height:54px;resize:vertical}
.btn{border:1px solid #cfd8d0;background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{background:#f1f5f1}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:var(--pri2)}
.btn.d{color:var(--rojo)}.btn.sm{padding:4px 8px;font-size:12px}.btn.on{background:#1a73e8;color:#fff;border-color:#1a73e8}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;color:#fff;background:#607d8b}
.pill.verde{background:var(--verde)}.pill.amarillo{background:var(--amarillo);color:#3a2e00}.pill.rojo{background:var(--rojo)}.pill.gris{background:var(--gris)}
.semsel{display:flex;gap:6px}.semsel button{flex:1;border:2px solid transparent;border-radius:8px;padding:7px 4px;cursor:pointer;font-weight:700;font-size:12px;opacity:.45}
.semsel button.on{opacity:1;border-color:#1d2a22}.semsel .B{background:var(--verde);color:#fff}.semsel .R{background:var(--amarillo)}.semsel .C{background:var(--rojo);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#f4f7f4;border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f4f7f4;position:sticky;top:0;cursor:pointer;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);user-select:none;z-index:1}
td.n,th.n{text-align:right}tr.click{cursor:pointer}tr.click:hover td{background:#f6faf6}
.tbl{overflow:auto;max-height:calc(100vh - 260px);border-radius:8px;border:1px solid var(--line);background:#fff}

.lote .t{display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:6px}.lote .m{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.5}
.muted{color:var(--mut)}.small{font-size:12px}
.warn{background:#fff6dc;border:1px solid #f0d98a;border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0}
.info{background:#e8f1fd;border:1px solid #b5cff5;border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.mapctl{background:#fff;border-radius:8px;box-shadow:var(--sh);padding:8px 10px;font-size:12px;max-height:60vh;overflow:auto}

.legend .it{display:flex;align-items:center;gap:6px;margin:3px 0}.legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.lbl{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:700;font-size:11px;text-shadow:0 0 3px #000,0 0 2px #000;text-align:center;line-height:1.15;padding:0}
.lbl:before{display:none}.lbl small{font-weight:600;font-size:10px;color:#ffe9a8}
.emk{font-size:20px;line-height:26px;text-align:center;filter:drop-shadow(0 0 2px #000)}
.emk span{display:inline-block;background:rgba(255,255,255,.85);border-radius:50%;width:28px;height:28px;line-height:28px;border:2px solid var(--c,#333)}
.mchip{background:rgba(255,255,255,.93);color:#1d2a22;border:2px solid var(--c);border-left-width:7px;border-radius:12px;padding:1px 8px;font-size:11.5px;white-space:nowrap;transform:translate(-50%,-50%);display:inline-block;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer}.mchip.vacio{background:rgba(236,239,241,.9);color:#546e7a}.mchip.due{animation:pulse 1.4s infinite}
.seclbl{background:var(--c);color:#000;font-weight:800;font-size:13px;padding:2px 10px;border-radius:4px;border:2px solid #000;white-space:nowrap;display:inline-block;transform:translate(0,-50%);letter-spacing:.5px}
.modlbl{background:rgba(0,0,0,.6);color:#fff;border-left:4px solid var(--c);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;white-space:nowrap;transform:translate(-50%,-150%);display:inline-block;pointer-events:none}
.emk .pin{width:32px;height:32px;border-radius:50%;background:#fff;border:2.5px solid var(--c);box-shadow:0 2px 6px rgba(0,0,0,.5);padding:3px;display:flex;align-items:center;justify-content:center}.emk .pin.sm{width:24px;height:24px;padding:2px;border-width:2px}
.herd.due{animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,109,0,.35)}}
.herd{cursor:grab;transform:translate(-50%,-50%)!important;background:#fff;border-radius:14px;padding:2px 7px;font-weight:700;font-size:12px;border:2px solid var(--c);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%);display:inline-block}
.gpsme{width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:transform .4s}.gpsme span{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25),0 1px 4px rgba(0,0,0,.5);animation:gp 2s infinite}@keyframes gp{50%{box-shadow:0 0 0 12px rgba(26,115,232,.08),0 1px 4px rgba(0,0,0,.5)}}
.gpsbtn,.mapbtn{background:#fff;border:0;border-radius:24px;box-shadow:0 2px 8px rgba(0,0,0,.3);padding:9px 14px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:14px;margin-top:6px}
.gpsbtn.on{background:#1a73e8;color:#fff}.mapbtn.on{background:#ff6f00;color:#fff}#lockBtn{margin-top:8px}
#gpsBar{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.25);padding:8px 10px;gap:8px;align-items:center;max-width:calc(100% - 140px);font-size:13px;line-height:1.5}

#addBar.on{display:flex}#addBar .chip{border:1px solid #cfd8d0;background:#fff;border-radius:20px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;flex:none}
#addBar .chip:hover{background:#eef6ee}#addBar .chip.x{background:#1d2a22;color:#fff}
#hint{display:none;position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:1001;background:#1d2a22;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;max-width:90%}
a.leaflet-control-layers-toggle{background-image:none!important;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none}a.leaflet-control-layers-toggle:after{content:'🛰️'}
.leaflet-control-layers-expanded{font-size:13px;padding:8px 10px}
#modal{position:fixed;inset:0;background:rgba(10,20,14,.45);display:none;align-items:center;justify-content:center;z-index:3000;padding:12px}
#modal.on{display:flex}#modal .box{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#123d23,#2e7d32);display:none;align-items:center;justify-content:center;z-index:5000;padding:16px}#login .lbox{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
body[data-rol=campo] .rol-enc,body[data-rol=campo] .rol-dev,body[data-rol=encargado] .rol-dev{display:none!important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2a22;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:4000;opacity:0;transition:.25s;pointer-events:none}#toast.on{opacity:1}
.chart{width:100%;height:190px}
.fgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;margin-bottom:8px}.fth{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#e8ece8;cursor:pointer}.fth img{width:100%;height:100%;object-fit:cover;display:block}.fth span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;text-align:center;padding:1px}

function refPots(sector,ref){const ids=UL.map(u=>u.id);const Sx=String(sector).toUpperCase().trim(),Rx=String(ref).toUpperCase();
  const blk=Sx==='EQE-1'?'S':Sx==='EQE-2'?'P':'N';const out=[],miss=[];
  if(blk==='S'&&/22-1/.test(Rx))return{pots:['22-1 Sur'].filter(x=>ids.includes(x)),miss:[]};
  for(const ns of (Rx.replace(/DEP[ÓO]SITO|DEP|POT/g,' ').match(/\d+/g)||[])){const n=String(+ns);let f=[];
    if(blk==='S')f=ids.filter(i=>i.startsWith(n+' ('));
    else if(blk==='P'){f=ids.includes(n)?[n]:ids.filter(i=>new RegExp('^'+n+' [EONS]$').test(i))}
    else{f=ids.filter(i=>new RegExp('^'+n+' [EONS]$').test(i));if(!f.length&&n==='22')f=ids.filter(i=>/^22-\d$/.test(i));if(!f.length&&ids.includes(n))f=[n]}

  return{pots:out,miss}}

function resumenDia(P){if(!P||!P.length)return null;let km=0;for(let i=1;i<P.length;i++){const a=ll2utm(P[i-1].lat,P[i-1].lon),b=ll2utm(P[i].lat,P[i].lon),d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d<3000)km+=d/1000}
  const hh=t=>new Date(t).toTimeString().slice(0,5);const pots=[];P.forEach(p=>{if(p.pot&&(!pots.length||pots[pots.length-1].pot!==p.pot))pots.push({pot:p.pot,hora:hh(p.at)})});
  const ms=new Date(P[P.length-1].at)-new Date(P[0].at);return{ini:hh(P[0].at),fin:hh(P[P.length-1].at),horas:`${Math.floor(ms/36e5)} h ${Math.round(ms%36e5/6e4)} min`,km,pots}}
async function verPersonal(uid,dia){const r=await SB.from('profiles').select('nombre,email,rol').eq('id',uid).single();const u=r.data||{};
  const d0=new Date(dia+'T00:00:00'),d1=new Date(d0.getTime()+864e5);const h=await SB.from('ubic_hist').select('lat,lon,pot,at,spd').eq('user_id',uid).gte('at',d0.toISOString()).lt('at',d1.toISOString()).order('at').limit(20000);
  const P=h.data||[];const s=resumenDia(P);const live=ST.u[uid];
  showView('mapa');if(ST.trail)ST.trail.remove();ST.trail=L.layerGroup().addTo(map);const col=staffCol(uid);
  if(P.length){const ll=P.map(p=>[p.lat,p.lon]);L.polyline(ll,{color:'#000',weight:8,opacity:.35,interactive:false}).addTo(ST.trail);L.polyline(ll,{color:col,weight:4.5,opacity:1}).addTo(ST.trail);
    L.circleMarker(ll[0],{radius:7,color:'#fff',weight:2,fillColor:'#2e7d32',fillOpacity:1}).bindTooltip('Entró '+s.ini).addTo(ST.trail);L.circleMarker(ll[ll.length-1],{radius:7,color:'#fff',weight:2,fillColor:'#c62828',fillOpacity:1}).bindTooltip('Última '+s.fin).addTo(ST.trail);
    map.fitBounds(L.latLngBounds(ll).pad(.2))}else if(live)map.setView([live.lat,live.lon],15);
  sheet('mid');const el=$('#side');
  el.innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0"><span class="prodsem" style="background:${col}"></span>${esc(u.nombre||u.email||'')}</h2><button class="btn sm" id="pvX">✕</button></div>
  <div class="small muted">${esc(ROLN[u.rol]||'')} · ${dFmt(dia)} ${live?' · '+((Date.now()-new Date(live.at))<6e5?'🟢 en vivo':'visto '+hace(live.at))+(live.pot?' en '+esc(live.pot):''):''}</div>
  <div class="row" style="margin:8px 0"><input type="date" id="pvD" value="${dia}" max="${todayS()}"><button class="btn sm p" id="pvP" ${P.length?'':'disabled'}>▶ Repetir recorrido</button>${live?'<button class="btn sm" id="pvL">📍 Dónde está</button>':''}</div>
  ${s?`<div class="stats" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><b>${s.ini}</b><span>Salió al campo</span></div><div class="stat"><b>${s.fin}</b><span>Última vez</span></div><div class="stat"><b>${s.horas}</b><span>En campo</span></div><div class="stat"><b>${fmt(s.km,1)}</b><span>km</span></div></div>
  <h3>Potreros por donde pasó</h3>${s.pots.length?`<div class="tbl"><table><tbody>${s.pots.map(p=>`<tr class="click" data-gp="${esc(p.pot)}"><td>${p.hora}</td><td><b>${esc(p.pot)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted small">Anduvo por caminos o fuera de los potreros.</div>'}`
  :'<div class="empty">Sin registros ese día dentro de EQE.</div>'}`;
  $('#pvX').onclick=()=>{if(ST.trail){ST.trail.remove();ST.trail=null}clearSel()};$('#pvD').onchange=e=>verPersonal(uid,e.target.value||todayS());
  if($('#pvL'))$('#pvL').onclick=()=>map.setView([live.lat,live.lon],16);
  el.querySelectorAll('[data-gp]').forEach(a=>a.onclick=()=>selectPot(a.dataset.gp));
  $('#pvP').onclick=()=>{if(!P.length)return;sheet('min');const ll=P.map(p=>[p.lat,p.lon]);let i=0;const mk=L.circleMarker(ll[0],{radius:9,color:'#fff',weight:3,fillColor:col,fillOpacity:1}).addTo(ST.trail);const step=Math.max(1,Math.floor(ll.length/250));
    const tip=L.tooltip({permanent:true,direction:'top',offset:[0,-10]}).setLatLng(ll[0]).addTo(ST.trail);
    const iv=setInterval(()=>{i+=step;if(i>=ll.length){clearInterval(iv);i=ll.length-1}mk.setLatLng(ll[i]);tip.setLatLng(ll[i]).setContent(new Date(P[i].at).toTimeString().slice(0,5)+(P[i].pot?' · '+P[i].pot:''));if(!map.getBounds().pad(-.1).contains(ll[i]))map.panTo(ll[i])},45)}}

// ================= routing =================
const VIEWS=['mapa','potreros','hacienda','proy','prod','3d','agro','personal','cfg','usr','sys'];
function showView(v){if(!VIEWS.includes(v)||(v==='sys'&&!can('*')))v='mapa';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));S.view=v;try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v)}catch{}renderView(true);if(v==='mapa'&&map)setTimeout(()=>map.invalidateSize(),50)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showView(b.dataset.v));
window.addEventListener('hashchange',()=>showView(location.hash.slice(1)));
const editing=sel=>{const a=document.activeElement;return a&&a.closest&&a.closest(sel)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
function renderView(force){const v=S.view||'mapa';
  if(v==='mapa'){renderMap();renderSide(force)}
  else if(v==='potreros'){if(force||!editing('#potrerosBox'))renderPotreros()}else if(v==='hacienda'){if(force||!editing('#haciendaBox'))renderHacienda()}
  else if(v==='proy'){if(force||!editing('#proyBox'))renderProy()}else if(v==='agro'){if(force||!editing('#agroBox'))renderAgro()}
  else if(v==='cfg'){if(force||!editing('#cfgBox'))renderCfg()}
  else if(v==='usr'){if(force)renderUsers()}
  else if(v==='sys'){if(force)sysPanel()}
  else if(v==='personal'){if(force)renderPersonal()}
  else if(v==='prod'){if(force||!editing('#prodBox'))renderProd()}
  else if(v==='3d'){render3d(force)}}
function calcAll(){potCalcCache={};modCalcCache={};UL.forEach(p=>potCalcCache[p.id]=potCalc(p.id));ML.forEach(m=>modCalcCache[m.id]=modCalc(m.id))}
function renderAll(){try{buildUnits();calcAll()}catch(e){logErr('cálculo',e)}if(S.sel&&!POT[S.sel])S.sel=null;if(S.selE&&!S.el[S.selE])S.selE=null;safe('encabezado',renderKpis);safe('vista '+(S.view||''),()=>renderView())}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.drawing)stopDraw();else if($('#modal').classList.contains('on'))closeModal()}});
buildUnits();calcAll();
initMap();
S.view=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'mapa';
showView(S.view);
Store.init();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>setInterval(()=>r.update().catch(()=>{}),30*60*1000)).catch(()=>{});let _sw=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_sw++)return;toast('🔄 App actualizada a la última versión')})}
</script>
